  <title>license: MIT</title>
  <linearGradient id="gl" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="cl"><rect width="94" height="20" rx="3" fill="#fff"/></clipPath>
  <g clip-path="url(#cl)">
